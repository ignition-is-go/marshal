[workspace]
resolver = "2"
members = ["crates/entities", "crates/daemon", "crates/shim", "crates/tui", "crates/web"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
# Core
serde = { version = "1", features = ["derive", "rc"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["serde"] }

# Myko stack (path-patched below for hot-reload against the local checkout).
myko = "^4.10.0"
myko-macros = "^4.10.0"
myko-server = "^4.10.0"
myko-leptos = "^4.10.0"
hyphae = "^1.0.0"

# Local crates
entities = { path = "crates/entities" }

[patch.crates-io]
myko = { git = "https://github.com/ignition-is-go/myko" }
myko-macros = { git = "https://github.com/ignition-is-go/myko" }
myko-server = { git = "https://github.com/ignition-is-go/myko" }
myko-leptos = { git = "https://github.com/ignition-is-go/myko" }
autosocket = { git = "https://github.com/ignition-is-go/myko" }
hyphae = { git = "https://github.com/ignition-is-go/hyphae" }
