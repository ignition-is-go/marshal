[workspace]
resolver = "2"
members = ["crates/entities", "crates/daemon", "crates/shim", "crates/tui", "crates/web"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
# Core
serde = { version = "1", features = ["derive", "rc"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["serde"] }
notify-debouncer-mini = "0.7"

# Myko stack — pulled from crates.io.
myko = "^4.10.0"
myko-macros = "^4.10.0"
myko-server = "^4.10.0"
myko-leptos = "^4.10.0"
hyphae = "^1.0.0"

# Local crates. `version` is required so `cargo publish` accepts the
# path dep — flux stamps both this and `workspace.package.version` to
# keep them in sync. `package` exposes the published crates.io name
# while keeping `entities` as the in-source identifier.
entities = { path = "crates/entities", package = "marshal-entities", version = "0.1.2" }
