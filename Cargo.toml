[workspace]
resolver = "2"
members = ["crates/entities", "crates/daemon", "crates/shim"]
exclude = ["crates/tui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
# Core
serde = { version = "1", features = ["derive", "rc"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["serde"] }

# Myko stack (path-patched below for hot-reload against the local checkout).
myko = "^4.10.0"
myko-macros = "^4.10.0"
myko-server = "^4.10.0"
hyphae = "^1.0.0"

# Local crates
entities = { path = "crates/entities" }

[patch.crates-io]
myko = { path = "../myko/libs/myko/core" }
myko-macros = { path = "../myko/libs/myko/macros" }
myko-server = { path = "../myko/libs/myko/server" }
myko-leptos = { path = "../myko/libs/myko/leptos" }
autosocket = { path = "../myko/libs/autosocket" }
hyphae = { path = "../hyphae/hyphae" }
