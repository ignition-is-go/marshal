[workspace]
resolver = "2"
members = ["crates/entities", "crates/daemon", "crates/shim", "crates/tui", "crates/ui"]

[workspace.package]
version = "0.49.5"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
# Core
serde = { version = "1", features = ["derive", "rc"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["serde"] }
notify-debouncer-mini = "0.7"
futures-util = "0.3"
tokio-tungstenite = "0.29"

# Myko stack — pulled from crates.io. Stock (no fork patch): ships the
# HTTP MCP router (POST /myko/mcp request/response + SSE) and the
# `mcp::filter` tool-visibility allowlist the pull model relies on.
# Keep the core and code-generating macros on the same release.
myko = "=6.15.1"
myko-macros = "=6.15.1"
myko-server = "=6.15.1"
myko-leptos = "=6.15.1"
myko-auth = "=6.15.1"
pulse-auth = { git = "https://github.com/ignition-is-go/pulse-multi-user.git", rev = "7c3d286fa33df758dec27361a3b4b5b815bc60d8" }
pulse-multi-user = { git = "https://github.com/ignition-is-go/pulse-multi-user.git", rev = "7c3d286fa33df758dec27361a3b4b5b815bc60d8" }
pulse-multi-user-leptos = { git = "https://github.com/ignition-is-go/pulse-multi-user.git", rev = "7c3d286fa33df758dec27361a3b4b5b815bc60d8" }
hyphae = "3.1.2"

# Local crates. `version` is required so `cargo publish` accepts the
# path dep — flux stamps both this and `workspace.package.version` to
# keep them in sync. The dep key matches the published crates.io
# name so cargo-flux's workspace topology resolution works (it keys
# the cross-crate publish graph on the dep key, not the `package =`
# alias). Source code uses `use marshal_entities::...` — the auto
# dash→underscore conversion Rust applies to crate names.
marshal-entities = { path = "crates/entities", version = "0.59.0" }

# Keep the shared notification primitives and all multi-user widgets on one source.
[patch.crates-io]
pulse-leptos-ui = { git = "https://github.com/ignition-is-go/pulse-leptos-ui.git", rev = "059ca7430bd938c832d1301db38d049372046073" }
