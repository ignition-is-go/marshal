[workspace]
resolver = "2"
members = ["crates/entities", "crates/daemon", "crates/shim", "crates/tui", "crates/web"]

[workspace.package]
version = "0.8.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
# Core
serde = { version = "1", features = ["derive", "rc"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["serde"] }
notify-debouncer-mini = "0.7"

# Myko stack — pulled from crates.io.
myko = "^4.14.0"
myko-macros = "^4.14.0"
myko-server = "^4.14.0"
myko-leptos = "^4.14.0"
hyphae = "^1.0.0"

# Local crates. `version` is required so `cargo publish` accepts the
# path dep — flux stamps both this and `workspace.package.version` to
# keep them in sync. The dep key matches the published crates.io
# name so cargo-flux's workspace topology resolution works (it keys
# the cross-crate publish graph on the dep key, not the `package =`
# alias). Source code uses `use marshal_entities::...` — the auto
# dash→underscore conversion Rust applies to crate names.
marshal-entities = { path = "crates/entities", version = "0.8.1" }

# Patch myko to the in-flight `feat/mcp-session-id-and-sse-push` branch
# until the curated MCP registry + Mcp-Session-Id work lands on main and
# a new myko release ships to crates.io. Pinned to a git rev (not a
# branch name) so deploys are deterministic — bumping the rev is an
# explicit commit, not a silent re-resolve at build time. Works on both
# pulse-admin (no clone needed for local dev — replaced ad-hoc with the
# `[patch.crates-io] myko = { path = ... }` form when iterating) and
# marshal-01 / Windows shim hosts (cargo clones the rev from github).
[patch.crates-io]
myko = { git = "https://github.com/ignition-is-go/myko.git", rev = "e7992f810b936d89db2d998655969241bde141ed" }
myko-macros = { git = "https://github.com/ignition-is-go/myko.git", rev = "e7992f810b936d89db2d998655969241bde141ed" }
myko-server = { git = "https://github.com/ignition-is-go/myko.git", rev = "e7992f810b936d89db2d998655969241bde141ed" }
myko-leptos = { git = "https://github.com/ignition-is-go/myko.git", rev = "e7992f810b936d89db2d998655969241bde141ed" }
