[workspace]
resolver = "2"
members = ["crates/entities", "crates/daemon", "crates/shim", "crates/tui", "crates/web"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
# Core
serde = { version = "1", features = ["derive", "rc"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["serde"] }
notify-debouncer-mini = "0.7"

# Myko stack — pulled from crates.io.
myko = "^4.10.0"
myko-macros = "^4.10.0"
myko-server = "^4.10.0"
myko-leptos = "^4.10.0"
hyphae = "^1.0.0"

# Local crates. `version` is required so `cargo publish` accepts the
# path dep — flux stamps both this and `workspace.package.version` to
# keep them in sync. The dep key matches the published crates.io
# name so cargo-flux's workspace topology resolution works (it keys
# the cross-crate publish graph on the dep key, not the `package =`
# alias). Source code uses `use marshal_entities::...` — the auto
# dash→underscore conversion Rust applies to crate names.
marshal-entities = { path = "crates/entities", version = "0.5.0" }
