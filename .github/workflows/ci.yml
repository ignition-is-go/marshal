name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ["self-hosted", "Linux", "X64", "ram-ge-16g", "disk-ge-100g"]
    # Backstop so a stuck step (e.g. a flaky apt mirror, a hung runner) fails
    # in minutes instead of burning to GitHub's 6-hour default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Report runner resources
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        run: python3 scripts/ci/report_resources.py

      - run: sudo sed -i 's|http://|https://|g' /etc/apt/sources.list.d/ubuntu.sources && sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev python3-venv tmux strace
      - name: Install pinned workflow validator
        run: |
          bash scripts/ci/install-actionlint.sh "$RUNNER_TEMP/actionlint"
          python3 -m venv "$RUNNER_TEMP/workflow-validator"
          "$RUNNER_TEMP/workflow-validator/bin/pip" install --disable-pip-version-check -r scripts/ci/requirements.txt
      - name: Validate workflow and preservation contracts
        env:
          ACTIONLINT: ${{ runner.temp }}/actionlint/actionlint
        run: |
          "$RUNNER_TEMP/workflow-validator/bin/python" scripts/ci/check_workflows.py --actionlint "$ACTIONLINT"
          "$RUNNER_TEMP/workflow-validator/bin/python" -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

        with:
          save-if: ${{ env.CI_NATIVE_CACHE_CONFIGURED != 'true' }}
          cache-targets: ${{ env.CI_NATIVE_CACHE_CONFIGURED != 'true' }}
      - name: Set up Cargo Flux and ROSE cache
        uses: ignition-is-go/cargo-flux@ae2ffa5f4420add3ab3c98665a4b5c0374bf2a5b
        with:
          version: 0.12.0
          cache: ${{ env.CI_NATIVE_CACHE_CONFIGURED == 'true' && 's3' || '' }}
          cache-endpoint: ${{ vars.CI_CACHE_S3_ENDPOINT || secrets.CI_CACHE_ENDPOINT }}
          cache-bucket: ${{ vars.CI_CACHE_S3_BUCKET || secrets.CI_CACHE_BUCKET }}
          cache-access-key-id: ${{ secrets.CI_CACHE_S3_ACCESS_KEY_ID || secrets.CI_CACHE_ACCESS_KEY }}
          cache-secret-access-key: ${{ secrets.CI_CACHE_S3_SECRET_ACCESS_KEY || secrets.CI_CACHE_SECRET_KEY }}
      - name: Restore ROSE compiler snapshot
        id: compiler-snapshot
        continue-on-error: true
        if: env.CI_NATIVE_CACHE_CONFIGURED == 'true'
        uses: ignition-is-go/pulse-actions/actions/flux-target-cache@9a22a3c3987bfa13c1619f6bc3ff14de893e35e8
        with:
          operation: restore
          scope: check
          plugin: cargo
      - name: Discard failed ROSE snapshot before a cold build
        if: steps.compiler-snapshot.outcome == 'failure'
        run: python3 scripts/ci/clean_failed_restore.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            plugins/marshal-opencode/package-lock.json
            plugins/marshal-pi/package-lock.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.11"
          no-cache: true
      - run: npm ci --prefix plugins/marshal-opencode
      - run: npm ci --prefix plugins/marshal-pi
      - run: npm ci --prefix plugins/marshal-prime-agent --workspaces=false --ignore-scripts
      - run: cargo flux run check
      - run: cargo flux run lint
      - run: cargo flux run test
      - name: Preserve native process failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-tmux-processes
          path: ${{ runner.temp }}/native-tmux-processes
          if-no-files-found: ignore
          retention-days: 7
      - name: Test native embedding-agent registration and reconnect
        run: |
          cargo build -p marshal-daemon -p marshal-shim --bins
          target_dir=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; print(json.load(sys.stdin)["target_directory"])')
          test -x "$target_dir/debug/marshal-daemon"
          test -x "$target_dir/debug/marshal-shim"
          MARSHAL_DAEMON_BIN="$target_dir/debug/marshal-daemon" bun test \
            plugins/marshal-opencode/test/embedding-agent.test.ts \
            plugins/marshal-pi/test/embedding-agent.test.ts \
            plugins/marshal-prime-agent/test/embedding-agent.test.ts
      - name: Test simulation fixture and scoring contracts
        run: python3 -m unittest discover -s scripts/sandbox -v

      - name: Report runner resources
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        run: python3 scripts/ci/report_resources.py

      - name: Save ROSE snapshot and clean local Cargo targets
        if: success() && steps.compiler-snapshot.outputs.state != ''
        uses: ignition-is-go/pulse-actions/actions/flux-target-cache@9a22a3c3987bfa13c1619f6bc3ff14de893e35e8
        with:
          operation: save
          state: ${{ steps.compiler-snapshot.outputs.state }}
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: ${{ github.workspace }}/scripts/ci/native-test-runner.sh
      CI_NATIVE_CACHE_CONFIGURED: ${{ (secrets.CI_CACHE_S3_ACCESS_KEY_ID || secrets.CI_CACHE_ACCESS_KEY) != '' }}
  browser-auth:
    runs-on: ["self-hosted", "Linux", "X64", "ram-ge-16g", "disk-ge-100g"]
    timeout-minutes: 30
    env:
      NO_COLOR: "true"
      CI_NATIVE_CACHE_CONFIGURED: ${{ (secrets.CI_CACHE_S3_ACCESS_KEY_ID || secrets.CI_CACHE_ACCESS_KEY) != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ env.CI_NATIVE_CACHE_CONFIGURED != 'true' }}
          cache-targets: ${{ env.CI_NATIVE_CACHE_CONFIGURED != 'true' }}
      - name: Set up Cargo Flux and ROSE cache
        uses: ignition-is-go/cargo-flux@ae2ffa5f4420add3ab3c98665a4b5c0374bf2a5b
        with:
          version: 0.12.0
          cache: ${{ env.CI_NATIVE_CACHE_CONFIGURED == 'true' && 's3' || '' }}
          cache-endpoint: ${{ vars.CI_CACHE_S3_ENDPOINT || secrets.CI_CACHE_ENDPOINT }}
          cache-bucket: ${{ vars.CI_CACHE_S3_BUCKET || secrets.CI_CACHE_BUCKET }}
          cache-access-key-id: ${{ secrets.CI_CACHE_S3_ACCESS_KEY_ID || secrets.CI_CACHE_ACCESS_KEY }}
          cache-secret-access-key: ${{ secrets.CI_CACHE_S3_SECRET_ACCESS_KEY || secrets.CI_CACHE_SECRET_KEY }}
      - name: Restore ROSE compiler snapshot
        id: compiler-snapshot
        continue-on-error: true
        if: env.CI_NATIVE_CACHE_CONFIGURED == 'true'
        uses: ignition-is-go/pulse-actions/actions/flux-target-cache@9a22a3c3987bfa13c1619f6bc3ff14de893e35e8
        with:
          operation: restore
          scope: browser-auth
          plugin: cargo
      - name: Discard failed ROSE snapshot before a cold build
        if: steps.compiler-snapshot.outcome == 'failure'
        run: python3 scripts/ci/clean_failed_restore.py
      - name: Test Myko ingress and reconnect contracts
        run: cargo test --locked -p marshal-daemon --test authenticated_ingress --test ws_reconnect_subscription

  # marshal-shim ships to Windows (ue_plugindev) as a cross-compiled
  # x86_64-pc-windows-gnu binary, but its Windows code is `#[cfg(windows)]`
  # and so is invisible to the Linux `check` job above. #19 silently
  # dropped the `windows-sys` dependency and broke the Windows build for
  # weeks because nothing in CI ever cross-compiled it. This job does, on
  # every PR, so a Windows-only break fails the check instead of the next
  # manual cross-build.
      - name: Save ROSE snapshot and clean local Cargo targets
        if: success() && steps.compiler-snapshot.outputs.state != ''
        uses: ignition-is-go/pulse-actions/actions/flux-target-cache@9a22a3c3987bfa13c1619f6bc3ff14de893e35e8
        with:
          operation: save
          state: ${{ steps.compiler-snapshot.outputs.state }}
  windows-cross-check:
    runs-on: ["self-hosted", "Linux", "X64", "ram-ge-16g", "disk-ge-100g"]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Report runner resources
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        run: python3 scripts/ci/report_resources.py

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ env.CI_NATIVE_CACHE_CONFIGURED != 'true' }}
          cache-targets: ${{ env.CI_NATIVE_CACHE_CONFIGURED != 'true' }}
      - name: Set up Cargo Flux and ROSE cache
        uses: ignition-is-go/cargo-flux@ae2ffa5f4420add3ab3c98665a4b5c0374bf2a5b
        with:
          version: 0.12.0
          cache: ${{ env.CI_NATIVE_CACHE_CONFIGURED == 'true' && 's3' || '' }}
          cache-endpoint: ${{ vars.CI_CACHE_S3_ENDPOINT || secrets.CI_CACHE_ENDPOINT }}
          cache-bucket: ${{ vars.CI_CACHE_S3_BUCKET || secrets.CI_CACHE_BUCKET }}
          cache-access-key-id: ${{ secrets.CI_CACHE_S3_ACCESS_KEY_ID || secrets.CI_CACHE_ACCESS_KEY }}
          cache-secret-access-key: ${{ secrets.CI_CACHE_S3_SECRET_ACCESS_KEY || secrets.CI_CACHE_SECRET_KEY }}
      - name: Restore ROSE compiler snapshot
        id: compiler-snapshot
        continue-on-error: true
        if: env.CI_NATIVE_CACHE_CONFIGURED == 'true'
        uses: ignition-is-go/pulse-actions/actions/flux-target-cache@9a22a3c3987bfa13c1619f6bc3ff14de893e35e8
        with:
          operation: restore
          scope: windows-cross-check
          plugin: cargo
      - name: Discard failed ROSE snapshot before a cold build
        if: steps.compiler-snapshot.outcome == 'failure'
        run: python3 scripts/ci/clean_failed_restore.py
      - name: Install mingw-w64 cross linker
        # Bound apt's network waits (Acquire timeouts + retries) so a flaky
        # azure.archive.ubuntu.com mirror can't hang the job indefinitely —
        # this is what stalled a release for ~2h on 2026-06-18.
        run: |
          sudo sed -i 's|http://|https://|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install -y -o Acquire::Retries=3 build-essential pkg-config mingw-w64
      - name: Cross-compile the Windows shim
        run: cargo check -p marshal-shim --target x86_64-pc-windows-gnu

      - name: Report runner resources
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        run: python3 scripts/ci/report_resources.py

  # Cross-compilation catches cfg(windows) build failures, but it cannot prove
  # the launcher/bridge behavior. Run the real multi-process wake canary on a
  # native Windows host as well: Windows Codex TUIs own isolated loopback
  # app-servers, so each bridge must wake only the thread its endpoint owns.
      - name: Save ROSE snapshot and clean local Cargo targets
        if: success() && steps.compiler-snapshot.outputs.state != ''
        uses: ignition-is-go/pulse-actions/actions/flux-target-cache@9a22a3c3987bfa13c1619f6bc3ff14de893e35e8
        with:
          operation: save
          state: ${{ steps.compiler-snapshot.outputs.state }}
    env:
      CI_NATIVE_CACHE_CONFIGURED: ${{ (secrets.CI_CACHE_S3_ACCESS_KEY_ID || secrets.CI_CACHE_ACCESS_KEY) != '' }}
  windows-native-wake:
    runs-on: {group: ci-windows-ephemeral, labels: [self-hosted, Windows, X64, ram-ge-8g, disk-ge-100g]}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install PowerShell 7
        shell: powershell
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'powershell.zip'
          $directory = Join-Path $env:RUNNER_TEMP 'powershell'
          curl.exe --fail --location --silent --show-error --retry 3 --connect-timeout 30 --max-time 180 --output $archive 'https://github.com/PowerShell/PowerShell/releases/download/v7.6.9/PowerShell-7.6.9-win-x64.zip'
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell download failed.' }
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'ce7484804c0f0ad4dda10c958e71acdaf7eebfb22505c1b480f89e0e9f1da94d') {
            throw 'PowerShell archive checksum mismatch.'
          }
          Expand-Archive -Path $archive -DestinationPath $directory
          $directory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Report runner resources
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        run: python scripts/ci/report_resources.py

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: false
      - name: Test Windows isolation recipe offline
        shell: pwsh
        run: ./scripts/ci/test_windows_isolation.ps1
      - name: Run native Windows Codex wake canary
        run: cargo test -p marshal-shim -- --nocapture

      - name: Report runner resources
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        run: python scripts/ci/report_resources.py
