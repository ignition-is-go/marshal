name: Release

# Single workflow that stamps the next version, tags it, creates a
# GitHub Release, and publishes the marshal-* crates to crates.io —
# all in one job. Combined because GITHUB_TOKEN-created `release:
# published` events don't trigger downstream workflows; chaining a
# separate publish.yml would silently never fire. (Switching to a
# GitHub App or PAT would unlock that path; for now the single-job
# flow is simpler and reliable.)

on:
  push:
    branches: [main, dev]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo install cargo-flux

      # Avoid an infinite release-on-release loop: the previous run of
      # this workflow committed `chore(release): vX`. If we re-trigger
      # on that push, skip and exit cleanly.
      - name: Skip if release commit
        id: check
        run: |
          if git log -1 --format='%s' | grep -q '^chore(release):'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git identity
        if: steps.check.outputs.skip == 'false'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Stamp, commit, tag, push, release, and publish
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          VERSION=$(cargo flux version)
          cargo flux stamp "$VERSION"
          cargo update --workspace
          cargo fmt --all
          git add -A
          git commit -m "chore(release): v$VERSION"
          git tag "v$VERSION" -m "Release $VERSION"
          git push origin HEAD "v$VERSION"
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          if [ "$BRANCH" = "main" ]; then
            gh release create "v$VERSION" --title "v$VERSION" --generate-notes --latest
          else
            gh release create "v$VERSION" --title "v$VERSION" --generate-notes --prerelease
          fi
          # Publish marshal-* crates to crates.io in workspace dep order.
          cargo flux run publish
