name: Release

# Single workflow that stamps the next version, tags it, creates a
# GitHub Release, and publishes the marshal-* crates to crates.io —
# all in one job. Combined because GITHUB_TOKEN-created `release:
# published` events don't trigger downstream workflows; chaining a
# separate publish.yml would silently never fire. (Switching to a
# GitHub App or PAT would unlock that path; for now the single-job
# flow is simpler and reliable.)

on:
  push:
    branches: [main, dev]

jobs:
  release:
    runs-on: ubuntu-latest
    # Backstop: this single job does crates.io publish + apt + cross-build +
    # upload. A flaky apt mirror hung it ~2h on 2026-06-18; fail in minutes.
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo install cargo-flux

      # Avoid an infinite release-on-release loop: the previous run of
      # this workflow committed `chore(release): vX`. If we re-trigger
      # on that push, skip and exit cleanly.
      - name: Skip if release commit
        id: check
        run: |
          if git log -1 --format='%s' | grep -q '^chore(release):'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git identity
        if: steps.check.outputs.skip == 'false'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Stamp, commit, tag, push, release, and publish
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          VERSION=$(cargo flux version)
          cargo flux stamp "$VERSION"
          # Keep Claude Code plugin manifests in lockstep with the workspace
          # version so `/plugin update` actually detects new releases.
          for f in plugins/*/.claude-plugin/plugin.json; do
            jq --arg v "$VERSION" '.version = $v' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done
          cargo update --workspace
          cargo fmt --all
          git add -A
          git commit -m "chore(release): v$VERSION"
          git tag "v$VERSION" -m "Release $VERSION"
          git push origin HEAD "v$VERSION"
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          if [ "$BRANCH" = "main" ]; then
            gh release create "v$VERSION" --title "v$VERSION" --generate-notes --latest
          else
            gh release create "v$VERSION" --title "v$VERSION" --generate-notes --prerelease
          fi
          # Publish marshal-* crates to crates.io in workspace dep order.
          cargo flux run publish

          # Publish prebuilt binaries as release assets so deployers download
          # instead of compiling — this is what lets the daemon and shims
          # track ONE released version off a single artifact source (no
          # cargo-install-from-pinned-tag for the daemon, no local
          # target/release build for the shims). Triple-suffixed so a fetch
          # can pick the right platform.
          rustup target add x86_64-pc-windows-gnu
          # Bounded apt (Acquire timeouts + retries) so a flaky Ubuntu mirror
          # can't hang the release — the failure mode that stalled v0.16.0 ~2h.
          sudo apt-get update \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install -y -o Acquire::Retries=3 mingw-w64
          cargo build --release -p marshal-daemon
          cargo build --release -p marshal-shim
          cargo build --release -p marshal-shim --target x86_64-pc-windows-gnu
          cp target/release/marshal-daemon  marshal-daemon-x86_64-unknown-linux-gnu
          cp target/release/marshal-shim    marshal-shim-x86_64-unknown-linux-gnu
          cp target/x86_64-pc-windows-gnu/release/marshal-shim.exe marshal-shim-x86_64-pc-windows-gnu.exe
          gh release upload "v$VERSION" \
            marshal-daemon-x86_64-unknown-linux-gnu \
            marshal-shim-x86_64-unknown-linux-gnu \
            marshal-shim-x86_64-pc-windows-gnu.exe
