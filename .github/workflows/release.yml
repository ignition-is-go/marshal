name: Release

# Single workflow that stamps the next version, tags it, creates a GitHub
# Release, and fans out binary builds and registry publication. The Linux
# deploy artifacts are uploaded before package publication begins: a registry
# credential or availability failure must never leave a valid release tag with
# no binaries for pulse-deploy to install.

on:
  push:
    branches: [main, dev]

# Serialize release runs. This job commits a version bump back onto the branch
# and pushes it, which cannot be done concurrently: two runs from back-to-back
# merges race the `git push` and all but one fail non-fast-forward (leaving
# tags with no built artifacts). `cancel-in-progress: false` QUEUES runs so each
# starts only after the previous has pushed. The release guard first fast-forwards
# a queued run's stale checkout, then re-checks whether the new tip is already a
# release commit. Back-to-back merges are therefore folded into the first run
# that reaches the branch tip; stale queued runs exit successfully.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Marshal is public: only the selected disposable public-ci group admits
    # its workflows. Generic self-hosted labels target private-estate runners
    # and leave this job queued forever.
    runs-on: public-ci
    # Backstop: this job does apt + cross-build + the marshal-ui WASM bundle +
    # upload. A flaky apt mirror hung it ~2h on 2026-06-18; fail in minutes.
    timeout-minutes: 40
    permissions:
      contents: write
      id-token: write
    env:
      CARGO_TERM_COLOR: always
    # Expose the release outcome to the macOS build job (which uploads the
    # darwin shims to the same release). `skip` mirrors the release-on-release
    # guard; `version` is the stamped version the mac job checks out + tags.
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Public runners are disposable and intentionally have no ambient
          # Rust components. The release script formats the stamped manifests.
          components: rustfmt
      - name: Install release system dependencies
        run: |
          # The public runner network permits Ubuntu mirrors over HTTPS only.
          sudo sed -i 's|http://|https://|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo timeout 8m apt-get update \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo timeout 8m apt-get install -y -o Acquire::Retries=3 \
            build-essential gh jq libssl-dev pkg-config
          gh --version
          jq --version
      - uses: Swatinem/rust-cache@v2
      # Prebuilt trunk (fast) — builds the marshal-ui WASM bundle shipped as a
      # release asset below.
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - run: cargo install cargo-flux

      # Re-sync before checking the subject. A serialized run may have been
      # queued from an older merge while the previous run pushed the release
      # commit; checking the trigger SHA would incorrectly try to release again.
      # This also avoids the infinite release-on-release loop.
      - name: Sync branch tip and skip if already released
        id: check
        run: |
          git pull --ff-only origin "$GITHUB_REF_NAME"
          if git log -1 --format='%s' | grep -q '^chore(release):'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(cargo flux version)
            if [ -z "$VERSION" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Configure git identity
        if: steps.check.outputs.skip == 'false'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Stamp, commit, tag, push, release, and upload Linux assets
        id: stamp
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          cargo flux stamp "$VERSION"
          # Keep Claude Code plugin manifests in lockstep with the workspace
          # version so `/plugin update` actually detects new releases.
          for f in plugins/*/.claude-plugin/plugin.json; do
            jq --arg v "$VERSION" '.version = $v' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done
          cargo update --workspace
          cargo fmt --all
          git add -A
          git commit -m "chore(release): v$VERSION"
          git tag "v$VERSION" -m "Release $VERSION"
          git push origin HEAD "v$VERSION"
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          if [ "$BRANCH" = "main" ]; then
            gh release create "v$VERSION" --title "v$VERSION" --generate-notes --latest
          else
            gh release create "v$VERSION" --title "v$VERSION" --generate-notes --prerelease
          fi
          # Publish prebuilt binaries as release assets so deployers download
          # instead of compiling — this is what lets the daemon and shims
          # track ONE released version off a single artifact source (no
          # cargo-install-from-pinned-tag for the daemon, no local
          # target/release build for the shims). Triple-suffixed so a fetch
          # can pick the right platform.
          #
          # The Linux deploy artifacts build and upload before the optional
          # Windows cross toolchain. v0.49.6 and v0.49.7 both hit the 40-min
          # backstop inside the mingw apt install — the mirror TRICKLED bytes,
          # which Acquire's stall timeouts never trip. A Windows/UI failure
          # below is therefore visible with fleet-deployable Linux assets
          # already present.
          cargo build --release -p marshal-daemon
          cargo build --release -p marshal-shim
          cp target/release/marshal-daemon  marshal-daemon-x86_64-unknown-linux-gnu
          cp target/release/marshal-shim    marshal-shim-x86_64-unknown-linux-gnu
          gh release upload "v$VERSION" \
            marshal-daemon-x86_64-unknown-linux-gnu \
            marshal-shim-x86_64-unknown-linux-gnu \
            scripts/install-codex.sh

          rustup target add x86_64-pc-windows-gnu
          # Bounded apt: Acquire timeouts + retries bound connection stalls,
          # and the hard `timeout` bounds a mirror that keeps trickling bytes
          # (the 2026-08-19 failure mode — 33 min inside one apt install).
          sudo timeout 8m apt-get install -y -o Acquire::Retries=3 mingw-w64
          cargo build --release -p marshal-shim --target x86_64-pc-windows-gnu
          cp target/x86_64-pc-windows-gnu/release/marshal-shim.exe marshal-shim-x86_64-pc-windows-gnu.exe

          # marshal-ui: build the Leptos/WASM dashboard to a static bundle and
          # ship it as a release asset, so the pulse-deploy `marshal_ui` role
          # downloads + serves it (like the daemon binary) — no compiler on the
          # marshal LXC. Platform-independent, so no triple suffix.
          rustup target add wasm32-unknown-unknown
          ( cd crates/ui && trunk build --release )
          tar -czf marshal-ui-dist.tar.gz -C crates/ui/dist .

          gh release upload "v$VERSION" \
            marshal-shim-x86_64-pc-windows-gnu.exe \
            marshal-ui-dist.tar.gz

  # Registry publication is deliberately downstream of the deploy artifacts.
  # It remains a required job (so missing credentials are visible), but cannot
  # strand a GitHub Release without the binaries used by pulse-deploy.
  publish-packages:
    needs: release
    if: needs.release.outputs.skip == 'false'
    runs-on: public-ci
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_TERM_COLOR: always
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}
      # npm trusted publishing uses GitHub OIDC, which requires Node >=22.14
      # and npm >=11.5.1. The runner's ambient npm has repeatedly fallen back
      # to legacy token auth (ENEEDAUTH), even though id-token permission is
      # present, so pin a supported toolchain rather than relying on the image.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install an OIDC-capable npm
        run: npm install --global npm@11
      - name: Verify publishing toolchain
        run: |
          node --version
          npm --version
          test "$(node -p 'Number(process.versions.node.split(`.`)[0]) >= 22')" = true
          test "$(npm --version | awk -F. '{ print ($1 > 11 || ($1 == 11 && $2 >= 5)) ? "true" : "false" }')" = true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-flux
      - name: Publish crates and plugins
        run: cargo flux run publish

  # marshal-shim for macOS — the ONLY marshal binary a Mac needs (the daemon +
  # UI run on the Linux marshal LXC; a Mac is purely a Codex/Claude CLIENT).
  # Darwin can't be cross-built from the Ubuntu release job (no Apple SDK), so a
  # native macos runner builds both arches and uploads them to the SAME release.
  # Gated on `release` so the tag + GitHub release already exist to upload into.
  build-macos:
    needs: release
    if: needs.release.outputs.skip == 'false'
    runs-on: public-ci-macos
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the exact commit the release job stamped + tagged.
          ref: v${{ needs.release.outputs.version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build + upload macOS marshal-shim (arm64 + x86_64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          # macos-latest is Apple Silicon (aarch64 native); x86_64 is a cross
          # target the universal Apple SDK on the runner already supports.
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release -p marshal-shim --target aarch64-apple-darwin
          cargo build --release -p marshal-shim --target x86_64-apple-darwin
          cp target/aarch64-apple-darwin/release/marshal-shim marshal-shim-aarch64-apple-darwin
          cp target/x86_64-apple-darwin/release/marshal-shim  marshal-shim-x86_64-apple-darwin
          gh release upload "v$VERSION" \
            marshal-shim-aarch64-apple-darwin \
            marshal-shim-x86_64-apple-darwin
