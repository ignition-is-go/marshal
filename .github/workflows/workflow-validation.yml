name: Workflow validation

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "action.yml"
      - "action.yaml"

permissions:
  contents: read

concurrency:
  group: workflow-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ignition-is-go/pulse-actions/.github/workflows/validate-workflows.yml@2c94ebf4fedd47f0c36d491e0dee5ad446a071b5 # v1.0.0
    with:
      runner-json: '"ci-public-linux-ephemeral"'
