[package]
name = "marshal-tui"
version = "0.15.1"
edition.workspace = true
license.workspace = true
description = "Terminal UI for the marshal coordination daemon — live roster + message stream."
repository = "https://github.com/ignition-is-go/marshal"
keywords = ["marshal", "agent", "tui", "ratatui", "myko"]
categories = ["command-line-utilities"]

[[bin]]
name = "marshal-tui"
path = "src/main.rs"

[package.metadata.flux]
tasks = ["check", "build", "test", "lint", "publish"]

[dependencies]
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
myko = { workspace = true }
hyphae = { workspace = true }
marshal-entities = { workspace = true }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
