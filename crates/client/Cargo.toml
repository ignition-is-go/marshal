[package]
name = "marshal-client"
version = "0.60.5"
edition.workspace = true
license.workspace = true
description = "Shared native client transport for the Marshal coordination server."
repository = "https://github.com/ignition-is-go/marshal"

[package.metadata.flux]
tasks = ["check", "build", "test", "lint", "publish"]

[dependencies]
anyhow = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true, features = ["native-tls"] }
gethostname = "1"
hyphae = { workspace = true }
log = { workspace = true }
marshal-entities = { workspace = true }
myko = { workspace = true }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
socket2 = "0.6"
