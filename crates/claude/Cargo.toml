[package]
name = "marshal-claude"
version = "0.60.5"
edition.workspace = true
license.workspace = true
description = "Marshal integration for Claude."
repository = "https://github.com/ignition-is-go/marshal"

[package.metadata.flux]
tasks = ["check", "build", "test", "lint", "publish"]

[dependencies]
chrono = { workspace = true }
marshal-entities = { workspace = true }
marshal-client = { path = "../client", version = "0.60.5" }
log = { workspace = true }
hyphae = { workspace = true }
myko = { workspace = true }
tokio = { workspace = true }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
