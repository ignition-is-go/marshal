[package]
name = "marshal-shim"
version = "0.3.4"
edition.workspace = true
license.workspace = true
description = "Stdio MCP shim that bridges Claude Code sessions to the marshal coordination daemon."
repository = "https://github.com/ignition-is-go/marshal"
keywords = ["marshal", "agent", "mcp", "claude", "myko"]
categories = ["network-programming", "command-line-utilities"]

[[bin]]
name = "marshal-shim"
path = "src/main.rs"

[package.metadata.flux]
tasks = ["check", "build", "test", "lint", "publish"]

[dependencies]
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
serde = { workspace = true }
serde_json = "1"
tokio = { workspace = true }
chrono = { workspace = true }
uuid = { version = "1", features = ["v4"] }
myko = { workspace = true }
hyphae = { workspace = true }
marshal-entities = { workspace = true }
gethostname = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
