[package]
name = "marshal-shim"
version = "0.50.0"
edition.workspace = true
license.workspace = true
description = "Stdio MCP shim that bridges Claude Code sessions to the marshal coordination daemon."
repository = "https://github.com/ignition-is-go/marshal"
keywords = ["marshal", "agent", "mcp", "claude", "myko"]
categories = ["network-programming", "command-line-utilities"]

[[bin]]
name = "marshal-shim"
path = "src/main.rs"

[package.metadata.flux]
tasks = ["check", "build", "test", "lint", "publish"]

[dependencies]
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
serde = { workspace = true }
serde_json = "1"
# codex-setup pre-trusts the Codex hooks by writing the trust-hash Codex itself
# computes (SHA256 over the normalized hook identity — see codex_setup.rs).
sha2 = "0.10"
tokio = { workspace = true }
chrono = { workspace = true }
uuid = { version = "1", features = ["v4"] }
myko = { workspace = true }
hyphae = { workspace = true }
marshal-entities = { workspace = true }
gethostname = "1"
# Event-driven git-branch refresh: OS fs-watch on the repo's HEAD (no polling).
notify-debouncer-mini = { workspace = true }
futures-util = { workspace = true }
tokio-tungstenite = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Used by session_discovery.rs's #[cfg(windows)] parent-process lookup
# (toolhelp snapshot for parent PID, GetProcessTimes for start time).
# Removed by mistake in #19; restored so the Windows build compiles.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

[dev-dependencies]
myko-server = { workspace = true }
tempfile = "3"
