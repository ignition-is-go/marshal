[package]
name = "marshal-host"
version = "0.60.5"
edition.workspace = true
license.workspace = true
description = "Local host daemon for Marshal agent sessions."
repository = "https://github.com/ignition-is-go/marshal"

[package.metadata.flux]
tasks = ["check", "build", "test", "lint"]

[dependencies]
anyhow = { workspace = true }
env_logger = { workspace = true }
http = "1"
hyphae = { workspace = true }
marshal-entities = { workspace = true }
serde_json = "1"
log = { workspace = true }
marshal-client = { path = "../client", version = "0.60.5" }
tokio = { workspace = true }
tempfile = "3"
uuid = { version = "1" }
