[package]
name = "marshal-entities"
version = "0.22.0"
edition.workspace = true
license.workspace = true
description = "Shared entity types and server-handled commands for the marshal multi-agent coordination service."
repository = "https://github.com/ignition-is-go/marshal"
keywords = ["marshal", "agent", "coordination", "myko"]
categories = ["network-programming"]

[package.metadata.flux]
# Published as a transitive dep of marshal-daemon/shim/tui. Cargo
# requires path deps to also be published (with a matching version),
# so this crate ships even though it isn't a user-facing artifact.
tasks = ["check", "build", "test", "lint", "publish"]

[features]
# `ts-export` activates the `#[cfg_attr(feature = "ts-export", derive(myko::TS),
# ts(export))]` the myko item/command/query macros emit into this crate, and
# turns on myko's ts-rs machinery so `myko::TS` resolves to `ts_rs::TS`.
# `codegen` additionally pulls `myko::codegen` (dprint/swc) for the typegen bin.
# Both are off by default so normal builds skip the ts-rs/codegen tree. (codegen
# needs unicode-width ^0.2.1 via swc; marshal-tui was bumped to ratatui 0.30 so
# the workspace no longer pins unicode-width =0.2.0 and this resolves in-tree.)
# `ts-export` pulls `ts-rs` itself — the macros emit `#[derive(ts_rs::TS)]`, so
# the crate must be in scope; pinned to myko's exact 11.1 so the `TS` trait is
# the same type myko's codegen walks.
ts-export = ["dep:ts-rs", "myko/ts-export"]
codegen = ["ts-export", "myko/codegen"]

[[bin]]
name = "typegen"
required-features = ["codegen"]

[dependencies]
serde = { workspace = true }
serde_json = "1"
chrono = { workspace = true }
myko = { workspace = true }
myko-macros = { workspace = true }
uuid = { version = "1", features = ["v4"] }
log = { workspace = true }
# Only linked under `ts-export` (the macros' `#[derive(ts_rs::TS)]`). Same 11.1
# as myko so the derived `TS` impls match the trait myko's typegen consumes.
ts-rs = { version = "11.1", features = ["serde-json-impl"], optional = true }
