<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>claude-coord</title>
    <link data-trunk rel="rust" data-wasm-opt="z"/>
    <style>
        :root {
            --bg-0: rgb(0, 0, 0);
            --bg-1: rgb(10, 10, 10);
            --bg-2: rgb(15, 15, 15);
            --fg-default: rgba(236, 236, 236, 0.95);
            --fg-subtle: rgba(236, 236, 236, 0.72);
            --fg-muted: rgba(236, 236, 236, 0.50);
            --border-subtle: rgba(236, 236, 236, 0.10);
            --border-muted: rgba(236, 236, 236, 0.16);
            --border-default: rgba(236, 236, 236, 0.22);
            --success: rgb(77, 189, 116);
            --error: rgb(255, 94, 78);
            --accent: rgb(192, 132, 252);
            --radius-sm: 2px;
            --radius-md: 3px;

            font-family: ui-sans-serif, system-ui, sans-serif;
            font-size: 13px;
            line-height: 1.4;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; width: 100%; }
        body { background: var(--bg-0); color: var(--fg-default); overflow: hidden; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-muted); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--border-default); }

        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 12px;
            gap: 10px;
        }

        h2 {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--fg-subtle);
            margin-bottom: 8px;
        }

        strong { font-weight: 600; }

        .status-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: var(--bg-1);
            border: 1px solid var(--border-muted);
            border-radius: var(--radius-md);
            flex-shrink: 0;
        }
        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .status-dot.connected { background: var(--success); }
        .status-dot.disconnected { background: var(--error); }

        .card {
            background: var(--bg-1);
            border: 1px solid var(--border-muted);
            border-radius: var(--radius-md);
            padding: 10px 12px;
            flex: 1;
            min-height: 0;
            overflow: auto;
        }
        .card:first-of-type { flex: 0 0 auto; }

        table.data {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        table.data th {
            text-align: left;
            font-weight: 600;
            color: var(--fg-muted);
            padding: 4px 8px;
            border-bottom: 1px solid var(--border-subtle);
        }
        table.data td {
            padding: 4px 8px;
            border-bottom: 1px solid var(--border-subtle);
            vertical-align: top;
        }
        table.data tr:hover td {
            background: rgba(236, 236, 236, 0.03);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 1px 8px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 600;
        }
        .badge.role {
            background: rgba(192, 132, 252, 0.12);
            color: var(--accent);
        }

        select.role-select {
            background: var(--bg-0);
            color: var(--accent);
            border: 1px solid var(--border-default);
            padding: 2px 6px;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            min-width: 140px;
            transition: border-color 0.12s ease;
        }
        select.role-select:hover {
            border-color: var(--accent);
        }
        select.role-select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .messages {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .msg {
            display: grid;
            grid-template-columns: 140px 16px 140px 1fr;
            gap: 6px;
            padding: 4px 6px;
            border-bottom: 1px solid var(--border-subtle);
            align-items: baseline;
        }
        .msg .from { color: var(--accent); text-align: right; }
        .msg .arrow { color: var(--fg-muted); }
        .msg .to { color: var(--success); }
        .msg .body { color: var(--fg-default); }

        .text-muted { color: var(--fg-muted); }
        .text-subtle { color: var(--fg-subtle); }
        .mono {
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
            font-size: 0.9rem;
        }
        .truncate {
            max-width: 360px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .flex-1 { flex: 1; }

        .empty {
            color: var(--fg-muted);
            font-style: italic;
            padding: 12px;
            text-align: center;
            font-size: 0.9rem;
        }
    </style>
</head>
<body></body>
</html>
