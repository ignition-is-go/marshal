[package]
name = "web"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "claude_coord_web"
path = "src/lib.rs"

[[bin]]
name = "claude-coord-web"
path = "src/main.rs"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_meta = { version = "0.8" }
console_error_panic_hook = "0.1"
log = { workspace = true }
myko = { workspace = true }
myko-leptos = { workspace = true }
entities = { workspace = true }
# Web targets WASM, so use `wasmbind` and skip default features to keep
# the bundle small. Don't inherit from workspace — Cargo can't override
# the workspace's implicit `default-features = true` from a member.
chrono = { version = "0.4", default-features = false, features = ["wasmbind", "clock", "serde"] }
