[package]
name = "marshal-daemon"
version = "0.59.2"
edition.workspace = true
license.workspace = true
description = "Coordination daemon for the marshal multi-agent service. Owns the live roster and routes messages between Claude Code sessions."
repository = "https://github.com/ignition-is-go/marshal"
keywords = ["marshal", "agent", "coordination", "myko", "daemon"]
categories = ["network-programming", "command-line-utilities"]

[lib]
name = "daemon"

[[bin]]
name = "marshal-daemon"
path = "src/main.rs"

[package.metadata.flux]
tasks = ["check", "build", "test", "lint", "publish"]

[dependencies]
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { workspace = true }
myko = { workspace = true }
myko-server = { workspace = true }
hyphae = { workspace = true }
marshal-entities = { workspace = true }
notify-debouncer-mini = { workspace = true }
uuid = { version = "1", features = ["v4"] }
chrono = { workspace = true }

# Shared Pulse sessions and presence run on the existing Myko listener.
myko-auth = { workspace = true }
pulse-auth = { workspace = true, features = ["myko-auth"] }
pulse-multi-user = { workspace = true, features = ["server"] }

[dev-dependencies]
serde_json = "1"
chrono = { workspace = true }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
hyphae = { workspace = true }
