[package]
name = "marshal-codex"
version = "0.60.5"
edition.workspace = true
license.workspace = true
description = "Marshal integration for Codex."
repository = "https://github.com/ignition-is-go/marshal"

[package.metadata.flux]
tasks = ["check", "build", "test", "lint", "publish"]

[dependencies]
futures-util = { workspace = true }
gethostname = "1"
hyphae = { workspace = true }
log = { workspace = true }
marshal-entities = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
uuid = { version = "1", features = ["v4"] }
anyhow = { workspace = true }
marshal-client = { path = "../client", version = "0.60.5" }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
myko = { workspace = true }
tempfile = "3"
