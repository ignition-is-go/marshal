[package]
name = "marshal-ui"
version = "0.50.0"
edition.workspace = true
license.workspace = true
description = "Leptos-based operator dashboard for the marshal coordination daemon."
repository = "https://github.com/ignition-is-go/marshal"
keywords = ["marshal", "agent", "leptos", "wasm", "myko"]
categories = ["wasm", "web-programming"]

[lib]
name = "marshal_ui"
path = "src/lib.rs"

[[bin]]
name = "marshal-ui"
path = "src/main.rs"

[package.metadata.flux]
# Web is build-and-test-only — the leptos operator dashboard isn't
# intended for `cargo install`, so it stays out of the publish task.
tasks = ["check", "build", "test", "lint"]

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_meta = { version = "0.8" }
console_error_panic_hook = "0.1"
log = { workspace = true }
myko = { workspace = true }
myko-leptos = { workspace = true }
marshal-entities = { workspace = true }

# Pulse shared design system + dockable-pane workspace. pulse-leptos-ui is the
# house component/token library (dark-first, self-styling via `styleable`);
# mullion is the VS Code-style splittable-pane workspace. Both are leptos-0.8
# CSR and inject their own scoped CSS at runtime — nothing to add to the trunk
# asset pipeline. mullion is git-only (unpublished); the committed Cargo.lock
# pins the exact rev so release + deploy stay reproducible.
pulse-leptos-ui = { version = "0.10.1", features = ["csr"] }
styleable = "0.1"
mullion = { git = "https://github.com/ignition-is-go/mullion.git", rev = "e8bfe0344b2d1bebff2bdd1fa65a86319c71df20" }

# Slot payload + persisted mullion layout (localStorage) are (de)serialized.
serde = { workspace = true }
serde_json = "1"

# Browser bindings. Declared unconditionally (not wasm-gated): leptos-csr,
# pulse-leptos-ui, and mullion already pull these into the host graph, and the
# shared 1 Hz clock (js_sys::Date) + window.location dialing + localStorage
# layout persistence use them directly. The crate only ever *runs* as wasm
# (served by trunk); `cargo check/build` on the host still resolves cleanly
# because these bindings compile everywhere — they simply no-op off-wasm.
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Location", "Storage", "HtmlElement", "HtmlInputElement"] }
