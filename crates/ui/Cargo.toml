[package]
name = "marshal-ui"
version = "0.21.1"
edition.workspace = true
license.workspace = true
description = "Leptos-based operator dashboard for the marshal coordination daemon."
repository = "https://github.com/ignition-is-go/marshal"
keywords = ["marshal", "agent", "leptos", "wasm", "myko"]
categories = ["wasm", "web-programming"]

[lib]
name = "marshal_ui"
path = "src/lib.rs"

[[bin]]
name = "marshal-ui"
path = "src/main.rs"

[package.metadata.flux]
# Web is build-and-test-only — the leptos operator dashboard isn't
# intended for `cargo install`, so it stays out of the publish task.
tasks = ["check", "build", "test", "lint"]

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_meta = { version = "0.8" }
console_error_panic_hook = "0.1"
log = { workspace = true }
myko = { workspace = true }
myko-leptos = { workspace = true }
marshal-entities = { workspace = true }
# Web targets WASM, so use `wasmbind` and skip default features to keep
# the bundle small. Don't inherit from workspace — Cargo can't override
# the workspace's implicit `default-features = true` from a member.
chrono = { version = "0.4", default-features = false, features = ["wasmbind", "clock", "serde"] }

# Browser-only: read window.location so the built bundle dials the daemon on
# whatever host served it (see daemon_address() in lib.rs). WASM target only,
# so host `cargo check` never pulls it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Location"] }
